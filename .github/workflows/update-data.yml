name: Mettre à jour la carte des feux

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-fire-map-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Télécharger et préparer les données
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FORCE_BURNED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/update_data.py

      - name: Enregistrer les nouveaux fichiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Mise à jour automatique des données incendies"
            git push
          fi
